name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- TEST ----------
      # On construit l'image de DEV (contient pytest/httpx) et on exécute
      # la suite de tests DANS le conteneur. Le job échoue si un test échoue.
      - name: Build de l'image de test (dev)
        run: docker build -t metrics-agent-test -f Dockerfile.dev .

      - name: Exécution de la suite de tests (pytest)
        run: docker run --rm metrics-agent-test pytest tests/ -v

      # ---------- BUILD & PUSH (uniquement si les tests sont passés) ----------
      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push de l'image de production
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics_agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics_agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
